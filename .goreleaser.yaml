# .goreleaser.yaml
# Build configuration for azguard
version: 2

project_name: azguard

builds:
  - id: azguard
    binary: azguard
    main: ./cmd/azguard
    env:
      - CGO_ENABLED=0
    goos:
      - windows
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - id: default
    formats: zip
    format_overrides:
      - goos: linux
        formats: tar.gz
    files:
      - LICENSE
      - configs/*

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ .Tag }}-next"

changelog:
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'

release:
  github:
    owner: cdobratz
    name: AzGuard
  draft: false
  prerelease: auto

# Homebrew Formula/azguard.rb is updated by scripts/package-repos.sh after
# this release, not by GoReleaser. brews is deprecated and a cask would
# replace the formula people already install.
scoops:
  - name: azguard
    directory: bucket
    homepage: https://azguard.dev
    description: Find and clean up forgotten and AI-agent-created cloud resources on Azure and AWS.
    license: MIT
    commit_author:
      name: azguard-releaser
      email: noreply@azguard.dev
    repository:
      owner: cdobratz
      name: scoop-azguard
      branch: master
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    skip_upload: '{{ if index .Env "TAP_GITHUB_TOKEN" }}false{{ else }}true{{ end }}'
