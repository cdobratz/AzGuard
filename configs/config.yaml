azure:
  auth_method: cli
  subscription_id: ""
  tenant_id: ""
  client_id: ""
  # client_secret is not stored here. Use AZURE_CLIENT_SECRET or the OS keychain.

aws:
  region: us-east-1
  # access_key, secret_key, and session_token are not stored here.
  # Use AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_SESSION_TOKEN, or the OS keychain.

gcp:
  project_id: ""

storage:
  path: ~/.azguard/data.db

# azguard init writes this section. It is not a secret.
account:
  azure: ""
  aws: ""
